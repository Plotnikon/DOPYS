name: Discounts Bot

on:
  workflow_dispatch:

jobs:
  run-discount-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run discount bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          DISCOUNT_TG_CHAT: ${{ secrets.DISCOUNT_TG_CHAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python discount_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discount_state.json
          git diff --staged --quiet || git commit -m "Update discount_state.json [skip ci]"
          git push
