name: Discounts Bot

on:
  workflow_dispatch:
  schedule:
    # приблизно раз на 16 днів (1-го і 17-го числа кожного місяця о 9:00 UTC).
    # для циклу в ~2 тижні можлива затримка в кілька годин не критична,
    # тож окремий зовнішній cron (як для rss.yml) тут не потрібен.
    - cron: "0 9 1,17 * *"

permissions:
  contents: write

jobs:
  run-discount-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests anthropic cloudscraper

      - name: Run discount bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          DISCOUNT_TG_CHAT: ${{ secrets.DISCOUNT_TG_CHAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python discount_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f discount_state.json ]; then
            git add discount_state.json
            git diff --staged --quiet || git commit -m "Update discount_state.json [skip ci]"
            git push
          else
            echo "discount_state.json ще не існує - нічого комітити"
          fi
