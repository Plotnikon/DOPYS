name: rss-feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.RSS_TG_CHAT }}
        run: python rss_bot.py

      - name: Save state
        run: |
          git config user.name "rss-feed-bot"
          git config user.email "actions@github.com"
          git add rss_state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
